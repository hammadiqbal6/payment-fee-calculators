name: Fee rate watcher

on:
  schedule:
    # Mondays 14:00 UTC
    - cron: '0 14 * * 1'
  workflow_dispatch:
    inputs:
      auto_merge:
        description: 'Auto-merge when every proposed change verifies and gates pass'
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: fee-rate-watcher
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run rate watcher
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Schedule always allows auto-merge; workflow_dispatch respects the input.
          AUTO_MERGE: ${{ github.event_name == 'schedule' && 'true' || inputs.auto_merge }}
        run: node scripts/rate-watcher/watch.mjs

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: rate-watcher-report
          path: docs/rate-watcher/
          if-no-files-found: ignore
